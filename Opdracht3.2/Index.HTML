<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <form action="index.html" method="post">
        <label for="Voornaam">Voornaam</label>
        <input type="text" name="Voornaam" placeholder="" pattern="[A-Za-z]" >
        <label for="Achternaam">Achternaam</label>
        <input type="text" name="Achternaam" placeholder=" "pattern="[A-Za-z]"><br>
        <label for="Aanhef">Aanhef</label><br>
        <input type="radio" name="Aanhef" value="Dhr" checked> Dhr <br>
        <input type="radio" name="Aanhef" value="Mevr"> Mevr <br>
        <input type="radio" name="Aanhef" value="Anders"> Anders <br>
        <label for="Straat en Huisnummer">Straat en Huisnummer</label>
        <input type="text" name="Straat en Huisnummer" placeholder=""><br>
        <label for="Postcode">Postcode</label>
        <input type="text" name="Postcode" placeholder="" pattern="[0-9]{4}[A-Z]{2}" maxlength="6"><br>
        <label for="Woonplaats">Woonplaats</label><br>
        <input type="text" name="Woonplaats" placeholder=""><br>
        <label for="land" >Land</label><br>
        <input type="text" name="land" placeholder=""><br>
        <label for="IBAN" >IBAN</label><br>
        <input type="text" name="IBAN" placeholder=""  pattern="[NL]{2}[0-9]{2}[A-Z]{4}[0-9]{10}" maxlength="18"><br>
        <label for="Type abbonoment">Type abonnement</label><br>
        <input type="checkbox"  name="Type abbonoment" value="Mobiel"> Mobiel <br>
        <input type="checkbox"  name="Type abbonoment" value="Glasvezel"> Glasvezel <br>
        <input type="checkbox"  name="Type abbonoment" value="TV"> TV <br>
        <label type="Datum van ingang abonnoment" for="Datum van ingang abonnoment">Datum van ingang abonnoment</label><br>
        <input type="date" name="Datum van ingang abonnoment" placeholder="" min="2026-09-23"><br>
        <label for="looptijd abonnement">Looptijd abonnement</label><br>
        <input type="number" name="looptijd abonnement" placeholder="maanden" pattern="[0-9]+" min="1"><br>
        <label for="aantal gebruikers">Aantal gebruikers</label><br>
        <input type="number" name="aantal gebruikers" placeholder="" pattern="[0-9]+" min="0" max="4"><br>
        <label for="emailadress">Emailadress</label><br>
        <input type="email" name="emailadress" placeholder="" required><br>
        <label for="password">Password</label><br>
        <input type="password" name="password" placeholder="" required><br>
        <input type="submit" value="Sluit abonnoment af">
    </form>
</body>
</html>
